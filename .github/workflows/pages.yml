name: Deploy demo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # Nerdbank.GitVersioning needs history to compute a version.
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Restore
      run: dotnet restore PanoramicData.ChartMagic.Demo/PanoramicData.ChartMagic.Demo.csproj

    - name: Publish
      run: dotnet publish PanoramicData.ChartMagic.Demo/PanoramicData.ChartMagic.Demo.csproj --configuration Release --output release --nologo

    # The site is served at the root of its custom domain, so the base href stays "/", the same
    # as the project's own index.html. The github.io address redirects there. Pages reads the
    # custom domain from this file on the deployed branch, and every deploy replaces that branch
    # whole, so the file is written on every run: without it the domain would be dropped.
    - name: Set the custom domain
      run: echo "chartmagic.panoramicdata.com" > release/wwwroot/CNAME

    # The stylesheet is linked by a fixed name, so a browser holding the previous one keeps
    # using it: new markup against old rules renders unstyled tables, a white chart panel and
    # the light chart in dark mode. All of that looked like rendering bugs and was a stale
    # file. Blazor fingerprints its own assets but not this one, so the commit is stamped on
    # here instead.
    - name: Cache-bust the stylesheet
      run: sed -i "s|css/demo.css|css/demo.css?v=${GITHUB_SHA}|g" release/wwwroot/index.html

    # Blazor routing is client-side, so a deep link has to be served the same document.
    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    # Without this, Pages treats the site as Jekyll and drops the _framework folder, which is
    # where the whole application lives.
    - name: Add .nojekyll
      run: touch release/wwwroot/.nojekyll

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: release/wwwroot
        single-commit: true
